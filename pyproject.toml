[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "convo-rag"
version = "0.1.0"
description = "A quiet Python terminal interface for chatting with a file."
requires-python = ">=3.11"
dependencies = ["textual>=8.2,<9"]

[project.scripts]
convo = "convo.__main__:main"

[project.optional-dependencies]
backend = [
    "alembic>=1.20.0",
    "docx2txt>=0.9",
    "httpx>=0.28.1",
    "keyring>=25.6",
    "llama-index-core>=0.14.25",
    "llama-index-readers-file>=0.7.0",
    "numpy>=2.4.6",
    "openai>=2.0",
    "pgvector>=0.5.1",
    "PyJWT[crypto]>=2.10",
    "psycopg[binary]>=3",
    "python-dotenv>=1.2.4",
    "pydantic>=2.0,<3",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.0,<3",
    "transformers>=4.51",
]

[tool.hatch.build.targets.wheel]
packages = ["convo"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "ty>=0.0.86",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["convo", "tests", "migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
