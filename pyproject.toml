[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "convo-cli"
version = "0.1.1"
description = "A local terminal RAG assistant for chatting with selected files."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohit Sharma" }]
keywords = ["cli", "rag", "terminal", "textual", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "textual>=8.2,<9",
    "alembic>=1.20.0",
    "docx2txt>=0.9",
    "httpx>=0.28.1",
    "keyring>=25.6",
    "llama-index-core>=0.14.25",
    "llama-index-readers-file>=0.7.0",
    "numpy>=2.4.6",
    "openai>=2.0",
    "pgvector>=0.5.1",
    "PyJWT[crypto]>=2.10",
    "psycopg[binary]>=3",
    "python-dotenv>=1.2.4",
    "pydantic>=2.0,<3",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.0,<3",
    "transformers>=4.51",
]

[project.urls]
Homepage = "https://github.com/madvillax/convo"
Repository = "https://github.com/madvillax/convo"
Issues = "https://github.com/madvillax/convo/issues"

[project.scripts]
convo = "convo.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["convo"]
force-include = { "migrations" = "convo/migrations" }

[tool.hatch.build.targets.sdist]
include = [
    "convo",
    "migrations",
    "tests",
    "scripts",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "pyproject.toml",
    "alembic.ini",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "ty>=0.0.86",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["convo", "tests", "migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
