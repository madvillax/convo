<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Convo file picker</title>
  <desc id="description">A terminal-style file picker in the my-project folder, with README.md selected.</desc>
  <rect x="1" y="1" width="1198" height="618" rx="12" fill="#0c0c0c" stroke="#393933" stroke-width="2" />
  <path d="M1 13A12 12 0 0 1 13 1h1174a12 12 0 0 1 12 12v52H1z" fill="#242424" />
  <circle cx="28" cy="27" r="7" fill="#ff5f57" />
  <circle cx="53" cy="27" r="7" fill="#febc2e" />
  <circle cx="78" cy="27" r="7" fill="#28c840" />
  <text x="600" y="33" text-anchor="middle" fill="#deded8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">convo</text>

  <text x="48" y="112" fill="#f4df4e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">convo</text>
  <text x="140" y="112" fill="#85857f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">/file</text>

  <rect x="150" y="142" width="900" height="410" fill="#111111" stroke="#686862" stroke-width="2" />
  <text x="178" y="185" fill="#f3f2ec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700">Choose a file</text>
  <text x="178" y="222" fill="#9a9a93" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">~/my-project</text>
  <rect x="176" y="244" width="848" height="2" fill="#393933" />

  <rect x="176" y="267" width="848" height="46" fill="#292927" />
  <rect x="176" y="267" width="4" height="46" fill="#f4df4e" />
  <text x="197" y="297" fill="#f4df4e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">README.md</text>
  <text x="197" y="349" fill="#d4d4ce" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">src/</text>
  <text x="197" y="391" fill="#d4d4ce" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">pyproject.toml</text>
  <text x="197" y="433" fill="#d4d4ce" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">package.json</text>

  <text x="178" y="514" fill="#85857f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">↑ ↓ move</text>
  <text x="322" y="514" fill="#85857f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">enter select</text>
  <text x="514" y="514" fill="#85857f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">esc close</text>
  <text x="48" y="589" fill="#85857f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">Choose one file, then ask a question in the composer.</text>
</svg>
